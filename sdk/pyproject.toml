[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cogext"
version = "0.2.2"
description = "Python SDK for COGEXT — the accountability layer for machine intelligence. Track what your AI agents promise and verify whether they kept their word."
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Proprietary"
authors = [
    { name = "Yamin / THRYVIX", email = "hello@cogextai.com" }
]
keywords = [
    "ai-agents",
    "accountability",
    "commitments",
    "llm",
    "agent-tracking",
    "reliability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://cogextai.com"
Documentation = "https://docs.cogextai.com"
Repository = "https://github.com/cogext/cogext"
Changelog = "https://github.com/cogext/cogext/releases"
"Issue Tracker" = "https://github.com/cogext/cogext/issues"

[tool.hatch.build.targets.wheel]
packages = ["cogext"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.sdist]
exclude = [
    "/.venv*",
    "/venv",
    "/dist",
    "/build",
    "/__pycache__",
    "/.pytest_cache",
    "/.mypy_cache",
    "/.ruff_cache",
    "*.egg-info",
]
